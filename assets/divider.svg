<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="20" viewBox="0 0 850 20" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 4.5; }
    }
    @keyframes scan {
      0% { transform: translateX(-120px); }
      100% { transform: translateX(970px); }
    }
    .node { animation: pulse 2.4s ease-in-out infinite; }
    .n1 { animation-delay: 0s; }
    .n2 { animation-delay: 0.6s; }
    .n3 { animation-delay: 1.2s; }
    .n4 { animation-delay: 1.8s; }
    .scanline { animation: scan 4s linear infinite; }
  </style>
  <defs>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0D1117" stop-opacity="1"/>
      <stop offset="15%"  stop-color="#7AA2F7" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#BB9AF7" stop-opacity="1"/>
      <stop offset="85%"  stop-color="#7AA2F7" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Base line -->
  <rect x="0" y="9" width="850" height="2" rx="1" fill="url(#lineGrad)" opacity="0.5"/>
  <!-- Glow line -->
  <rect x="0" y="9" width="850" height="2" rx="1" fill="url(#lineGrad)" filter="url(#glow)" opacity="0.3"/>
  <!-- Tick marks -->
  <line x1="170" y1="6" x2="170" y2="14" stroke="#7AA2F7" stroke-width="0.8" opacity="0.3"/>
  <line x1="340" y1="5" x2="340" y2="15" stroke="#9B7BF7" stroke-width="0.8" opacity="0.3"/>
  <line x1="510" y1="5" x2="510" y2="15" stroke="#9B7BF7" stroke-width="0.8" opacity="0.3"/>
  <line x1="680" y1="6" x2="680" y2="14" stroke="#7AA2F7" stroke-width="0.8" opacity="0.3"/>
  <!-- Pulse nodes -->
  <circle cx="170" cy="10" r="3" fill="#7AA2F7" class="node n1"/>
  <circle cx="340" cy="10" r="3" fill="#9B7BF7" class="node n2"/>
  <circle cx="510" cy="10" r="3" fill="#BB9AF7" class="node n3"/>
  <circle cx="680" cy="10" r="3" fill="#7AA2F7" class="node n4"/>
  <!-- Scanning beam -->
  <rect x="0" y="8" width="120" height="4" rx="2" fill="url(#scanGrad)" class="scanline"/>
</svg>
