<?xml version="1.0" encoding="UTF-8"?>
<svg width="850" height="56" viewBox="0 0 850 56" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code','Consolas',monospace">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .live { animation: blink 2s ease-in-out infinite; }
    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 1.0s; }
    .d4 { animation-delay: 1.5s; }
  </style>
  <defs>
    <linearGradient id="tBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7AA2F7" stop-opacity="0.4"/>
      <stop offset="50%"  stop-color="#BB9AF7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7AA2F7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <!-- Outer shell -->
  <rect x="0" y="0" width="850" height="56" rx="10" fill="#0D1117" stroke="url(#tBorder)" stroke-width="1"/>
  <!-- Vertical separators -->
  <line x1="212.5" y1="10" x2="212.5" y2="46" stroke="#21262D" stroke-width="1"/>
  <line x1="425"   y1="10" x2="425"   y2="46" stroke="#21262D" stroke-width="1"/>
  <line x1="637.5" y1="10" x2="637.5" y2="46" stroke="#21262D" stroke-width="1"/>
  <!-- Cell 1: Current Focus -->
  <circle cx="24" cy="22" r="4" fill="#9ECE6A" class="live d1"/>
  <text x="36" y="22" font-size="8" fill="#8B949E" dominant-baseline="middle" letter-spacing="1">CURRENT FOCUS</text>
  <text x="24" y="40" font-size="10" fill="#c0caf5" dominant-baseline="middle">Agentic AI &amp; Cloud-Native</text>
  <!-- Cell 2: Infrastructure -->
  <circle cx="226" cy="22" r="4" fill="#7AA2F7" class="live d2"/>
  <text x="238" y="22" font-size="8" fill="#8B949E" dominant-baseline="middle" letter-spacing="1">INFRASTRUCTURE</text>
  <text x="226" y="40" font-size="10" fill="#c0caf5" dominant-baseline="middle">AWS &#183; Terraform &#183; EKS &#183; Docker</text>
  <!-- Cell 3: AI Orchestration -->
  <circle cx="439" cy="22" r="4" fill="#BB9AF7" class="live d3"/>
  <text x="451" y="22" font-size="8" fill="#8B949E" dominant-baseline="middle" letter-spacing="1">AI ORCHESTRATION</text>
  <text x="439" y="40" font-size="10" fill="#c0caf5" dominant-baseline="middle">LangGraph &#183; FastAPI &#183; RAG</text>
  <!-- Cell 4: Observability -->
  <circle cx="651" cy="22" r="4" fill="#7AA2F7" class="live d4"/>
  <text x="663" y="22" font-size="8" fill="#8B949E" dominant-baseline="middle" letter-spacing="1">OBSERVABILITY</text>
  <text x="651" y="40" font-size="10" fill="#c0caf5" dominant-baseline="middle">Prometheus &#183; Grafana &#183; ELK</text>
</svg>
